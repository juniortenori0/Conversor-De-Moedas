<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <title>Tenorio Converte</title>
</head>

<body>

    <img class="logo" src="./assets/logo.gif" alt="Logo Tenorio Converte">

    <main>
        <label>
            Converter <b>Dê</b>
            <select>
                <option>R$ Real Brasileiro</option>
            </select>
        </label>

        <label>
            Converter <b>Para</b>
            <select class="currency-select">
                <option value="dolar">US$ Dólar Americano</option>
                <option value="euro">€ Euro</option>
                <option value="libra">£ Libra Esterlina</option>
                <option value="bitcoin">₿ Bitcoin</option>
            </select>
        </label>

        <label>
            <b>Valor</b>
            <input class="input-currency" placeholder="R$ 10.000,00">
        </label>

        <button id="convert-button">Converter</button>

        <section>
           
             <div class="currency-box">
                <img class="img-br" src="./assets/brasil.png" alt="Bandeira do Brasil">
                <p class="currency">Real</p>
                <p class="currency-value-to-convert">R$ 0,00</p>
            </div>

            <div>
                <img class="arrow-img" src="./assets/vector.png" alt="seta">
            </div>


            <div class="currency-box">
                <img class="currency-img" src="./assets/eua.png" alt="Bandeira dos EUA">
                <p class="currency" id="currency-name">Dólar Americano</p>
                <p class="currency-value">US$ 0.00</p> 
            </div>

        </section>

    </main>

    <script src="./scripts.js"></script>

</body>

</html>
